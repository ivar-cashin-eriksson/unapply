[project]
name = "unapply"
version = "0.1.0"
description = "Evidence-backed candidate profiles over MCP: companies rank opted-in applicants and pay to reveal the top matches. No CVs until asked."
readme = "README.md"
authors = [{ name = "ivar-cashin-eriksson" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "pydantic>=2.8",
    "pypdf>=7.1.1",
]

[project.optional-dependencies]
# Added as each POC milestone needs them (see docs/poc-plan.md).
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.2"]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
unapply = "unapply:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# target-version is inferred from requires-python.
line-length = 88
src = ["src"]
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = [
    "E4",   # Import-related errors
    "E7",   # Statement-related errors
    "E9",   # Runtime-related errors
    "F",    # Undefined names, unused imports/variables, etc.
    "I",    # Import sorting
    "B",    # Common bug patterns, including mutable defaults
    "UP",   # Modern Python syntax
    "D",    # Docstrings, NumPy convention (see pydocstyle below)
    "D417", # Every parameter is documented (not part of the NumPy convention)
    "ANN",  # Type hints on function arguments and return values
]

[tool.ruff.lint.per-file-ignores]
# Docstring and type hint rules apply only to the package.
"!src/unapply/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Always write LF, so files stay the same on Windows and macOS/Linux.
line-ending = "lf"
