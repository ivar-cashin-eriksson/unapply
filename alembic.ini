# For writing migrations with the `alembic` command, such as
#   uv run alembic revision --autogenerate -m "Add skill taxonomy"
# The database is $UNAPPLY_DATABASE_URL, by default data/unapply.db (see
# src/unapply/db/engine.py). `unapply db init` doesn't need this file.

[alembic]
script_location = src/unapply/db/migrations
file_template = %%(rev)s_%%(slug)s

# Format and lint new migrations like the rest of the package.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
