# The skill taxonomy: one canonical name per skill, its synonyms, and how skills
# relate. Read by unapply.taxonomy; `unapply db init` loads it into the database.
#
# Each entry under `skills` is a canonical name (lowercase), with optional:
#   category  technology, method, domain, soft_skill, language or certification
#   synonyms  other names for the same skill; they are merged into the canonical name
#             at extraction, review and rubric time. "-" and "_" already count as
#             spaces, so "time-series forecasting" needs no synonym.
#   implies   skills that using this one means using ("dbt" implies "sql")
#   broader   skills this one is a kind of ("lightgbm" is a kind of "gradient
#             boosting")
# Relations point from the specific skill to the general one, and must name
# canonical skills in this file. Only add a synonym when the two names mean the same
# skill; a related but different skill is a relation, not a synonym.

skills:
  # Programming languages and query languages
  python:
    category: technology
    synonyms: [python 3, python3]
  r:
    category: technology
    synonyms: [r language, r programming]
