# The demo job board: the synthetic jobs stored by `POST /demos/board`, each with its
# rubric approved and the synthetic pool (tests/fixtures/pool) connected to it.
# Read by unapply.jobs.board; see the README in each job's folder.
#
# today      the date current roles run to, so years of experience stay fixed (the
#            pool's date)
# jobs       one entry per job, in the order they are posted:
#   folder     the job's folder here (its ad and recorded rubric extraction)
#   vacancies  how many people the job hires, as the employer would set it
#   llm        whether the pool has recorded LLM scorer answers for the job; only
#              Fjord Grocery does, so the other jobs are matched with the baseline
